<!DOCTYPE html>
<html lang='id'>
    <head>
        <meta charset="UTF-8">
        <title>aplikasi to do list harian saya</title>
        <link rel="stylesheet" href="to_dolist.css">
    </head>
    <body>
        <section>
            <!--sesi penambahan tugas-->
            <h1>Membantu kamu utk melacak apa saja aktivita keseharian kamu</h1>
            <p>To-Do-List harian</p>
            <input id="AktivitasHarian" type="text" placeholder="aktivitas pertamamu">
            <button id="tombolInput" type="button">Tambah</button>
            <h2>Daftar Tugas</h2>
            <ul id="tasklist"></ul>
        </section>
        <section>
            <!--sesi tugas selesai-->
            <h2>Daftar tugas selesai</h2>
            <ul id="daftar_selesai"></ul>
        </section>
        <script src="to_dolist.js"></script>
    </body>
</html>
